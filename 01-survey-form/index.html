<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Feedback Survey</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --input-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-container {
      text-align: center;
      margin-bottom: 2rem;
      max-width: 600px;
    }

    #title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      margin-bottom: 0.5rem;
      background: linear-gradient(to r, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #description {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    #survey-form {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 1.75rem;
    }

    .form-group label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .input-text, select, textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .input-text:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    /* Styling Custom Selection Controls */
    .choices-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .choice-label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 400 !important;
      cursor: pointer;
      color: var(--text-muted) !important;
    }

    .choice-label input {
      accent-color: var(--accent-color);
      width: 1.1rem;
      height: 1.1rem;
    }

    .choice-label:hover {
      color: var(--text-main) !important;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      font-family: inherit;
    }

    #submit {
      display: block;
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #38bdf8 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      margin-top: 2rem;
    }

    #submit:hover {
      opacity: 0.95;
    }

    #submit:active {
      transform: scale(0.99);
    }

    @media (max-width: 480px) {
      #survey-form {
        padding: 1.5rem;
      }
      #title {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1 id="title">Developer Community Survey</h1>
    <p id="description">Thank you for taking the time to help us improve our open-source tools.</p>
  </div>

  <form id="survey-form">

    <div class="form-group">
      <label id="name-label" for="name">Name</label>
      <input 
        type="text" 
        id="name" 
        class="input-text"
        placeholder="Enter your full name" 
        required
      />
    </div>

    <div class="form-group">
      <label id="email-label" for="email">Email</label>
      <input 
        type="email" 
        id="email" 
        class="input-text"
        placeholder="Enter your email address" 
        required
      />
    </div>

    <div class="form-group">
      <label id="number-label" for="number">Years of Experience (Optional)</label>
      <input 
        type="number" 
        id="number" 
        class="input-text"
        min="0" 
        max="50" 
        placeholder="e.g., 5"
      />
    </div>

    <div class="form-group">
      <label for="dropdown">Which ecosystem do you use most?</label>
      <select id="dropdown" required>
        <option value="" disabled selected>Select an option</option>
        <option value="frontend">Frontend (React, Vue, Web)</option>
        <option value="backend">Backend (Node, Go, Python)</option>
        <option value="mobile">Mobile (Swift, Kotlin, Flutter)</option>
        <option value="data">Data Science & AI</option>
      </select>
    </div>

    <div class="form-group">
      <label>Would you recommend our toolset to a friend?</label>
      <div class="choices-group">
        <label class="choice-label">
          <input type="radio" name="recommend" value="definitely" checked /> Definitely
        </label>
        <label class="choice-label">
          <input type="radio" name="recommend" value="maybe" /> Maybe
        </label>
        <label class="choice-label">
          <input type="radio" name="recommend" value="not-sure" /> Not Sure
        </label>
      </div>
    </div>

    <div class="form-group">
      <label>What areas would you like to see improved? <span style="font-weight: 400; color: var(--text-muted);">(Select all that apply)</span></label>
      <div class="choices-group">
        <label class="choice-label">
          <input type="checkbox" name="improvements" value="documentation" /> Documentation
        </label>
        <label class="choice-label">
          <input type="checkbox" name="improvements" value="performance" /> Speed and Performance
        </label>
        <label class="choice-label">
          <input type="checkbox" name="improvements" value="plugins" /> Plugin Ecosystem
        </label>
        <label class="choice-label">
          <input type="checkbox" name="improvements" value="community" /> Community Forums
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="comments">Any additional feedback or feature requests?</label>
      <textarea id="comments" placeholder="Tell us what's on your mind..."></textarea>
    </div>

    <button type="submit" id="submit">Submit Feedback</button>

  </form>

</body>
</html>
